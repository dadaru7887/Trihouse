services:
  mysql:
    image: mysql:8.4
    container_name: trihouse-mysql
    restart: unless-stopped
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${FMS_DB_DATABASE:-trihouse_fms}
      MYSQL_USER: ${FMS_DB_USER:-fms_gateway}
      MYSQL_PASSWORD: ${FMS_DB_PASSWORD}
    ports:
      - 127.0.0.1:${FMS_DB_PORT:-3306}:3306
    volumes:
      - trihouse_mysql_data:/var/lib/mysql
      - ./db/migrations/001_physical_v1_baseline.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/init/002_record_physical_baseline.sh:/docker-entrypoint-initdb.d/002_record_physical_baseline.sh:ro
      - ./db/migrations:/trihouse-migrations:ro
      - ./db/init/003_apply_physical_migrations.sh:/docker-entrypoint-initdb.d/003_apply_physical_migrations.sh:ro
      - ./db/seeds/seed_hardware.sql:/docker-entrypoint-initdb.d/004_seed.sql:ro
      - ./db/init/003_grant_gateway_recovery.sh:/docker-entrypoint-initdb.d/005_grant_gateway_recovery.sh:ro
    # compose.control.yaml 이 만드는 격리 네트워크. Gateway만 함께 붙는다.
    networks:
      - db_internal
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  db_internal:
    name: trihouse_db_internal

volumes:
  trihouse_mysql_data:
