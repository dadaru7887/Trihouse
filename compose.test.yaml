services:
  mysql-test:
    image: mysql:8.4
    container_name: trihouse-mysql-test
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: trihouse_fms
      MYSQL_USER: fms_gateway
      MYSQL_PASSWORD: test_gateway_password
    ports:
      - 127.0.0.1:3307:3306
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./db/schema_mysql.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed_dev.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -uroot -ptest_root_password --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
