[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:segmentation]
command=/entrypoint.sh python /workspace/segmentation_node.py
autorestart=true
startretries=5
stdout_logfile=/var/log/segmentation.out.log
stderr_logfile=/var/log/segmentation.err.log

[program:vlm_rl_corrector]
command=/entrypoint.sh python /workspace/vlm_rl_corrector_node.py
autorestart=true
startretries=5
stdout_logfile=/var/log/vlm_rl_corrector.out.log
stderr_logfile=/var/log/vlm_rl_corrector.err.log
