# omx_01 · OMX-01 (설치 로봇)
#   다리 없음. gz_ros2_control 이 ROS 2 로 직접 주고받는다.
#   관절 상태: joint_state_broadcaster 가 /omx_01/joint_states 로 낸다.
#   팔 명령: /omx_01/arm_controller · /omx_01/gripper_controller 액션.

