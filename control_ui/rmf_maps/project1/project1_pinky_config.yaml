# project1 프로젝트의 Open-RMF fleet adapter 설정.
# rmf_control_ui 가 맵 프로젝트에서 생성했다. 손으로 고치면
# 다음 저장 때 덮어써진다.
rmf_fleet:
  name: "project1_pinky"
  limits:
    linear: [0.800, 2.500] # velocity, acceleration
    angular: [1.500, 3.200]
  profile: # 로봇을 원으로 본 반경. 맵의 로봇 안전 기준에서 가져왔다.
    footprint: 0.050
    vicinity: 0.100
  reversible: False
  battery_system:
    voltage: 12.000
    capacity: 24.000
    charging_current: 5.000
  mechanical_system:
    mass: 20.000
    moment_of_inertia: 10.000
    friction_coefficient: 0.220
  ambient_system:
    power: 20.000
  tool_system:
    power: 0.000
  recharge_threshold: 0.100
  recharge_soc: 1.000
  publish_fleet_state: 10.0
  account_for_battery_drain: True
  task_capabilities:
    loop: True
    delivery: True
  actions: ["teleop", "armLoad"]
  finishing_request: "nothing"
  responsive_wait: False
  reassign_task_interval: 120
  robots:
    pinky_01:
        charger: "충전1"
    pinky_02:
        charger: "충전2"

# 설치 로봇은 플릿에 넣지 않는다. 배차 대상이 아니다.
# 이 프로젝트의 설치 로봇:
#   omx_01 · OMX-01 (open_manipulator_x) @ 설비1
#   omx_02 · OMX-02 (open_manipulator_x) @ 설비2
#   omx_03 · OMX-03 (open_manipulator_x) @ 설비3

fleet_manager:
  ip: "127.0.0.1"
  port: 22011
