# gwanghee 프로젝트의 Open-RMF fleet adapter 설정.
# rmf_control_ui 가 맵 프로젝트에서 생성했다. 손으로 고치면
# 다음 저장 때 덮어써진다.
rmf_fleet:
  name: "gwanghee_pinky"
  limits:
    linear: [0.500, 0.750] # velocity, acceleration
    angular: [0.600, 2.000]
  profile: # 로봇을 원으로 본 반경. 맵의 로봇 안전 기준에서 가져왔다.
    footprint: 0.050
    vicinity: 0.150
  reversible: True
  battery_system:
    voltage: 12.000
    capacity: 24.000
    charging_current: 5.000
  mechanical_system:
    mass: 20.000
    moment_of_inertia: 10.000
    friction_coefficient: 0.220
  ambient_system:
    power: 20.000
  tool_system:
    power: 0.000
  recharge_threshold: 0.100
  recharge_soc: 1.000
  publish_fleet_state: 10.0
  account_for_battery_drain: True
  task_capabilities:
    loop: True
    delivery: True
  actions: ["teleop", "armLoad"]
  finishing_request: "park"
  responsive_wait: True
  reassign_task_interval: 120
  robots:
    PK_03:
        charger: "충전1"

# 설치 로봇은 플릿에 넣지 않는다. 배차 대상이 아니다.
# 이 프로젝트의 설치 로봇:
#   OMX-01 · 매니퓰레이터 1호 (omx_f) @ OMX1
#   OMX-02 · 매니퓰레이터 2호 (omx_f) @ OMX2

fleet_manager:
  ip: "127.0.0.1"
  port: 22011
