# pinky_02 한 대의 토픽 목록.
# 실행에는 프로젝트 전체를 묶은 <맵이름>_gz_bridge.yaml 을 쓴다.
# clock 과 tf 는 월드에 하나뿐이라 여기 넣지 않았다.
#
# 이름을 양쪽 다 절대 경로로 적는다. 로봇이 여러 대일 때
# 상대 이름을 쓰면 전부 같은 토픽으로 겹친다.

# pinky_02 · PK-02 (이동 로봇)
- ros_topic_name: "/pinky_02/odom"
  gz_topic_name: "/pinky_02/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky_02/cmd_vel_smoothed"
  gz_topic_name: "/pinky_02/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/pinky_02/scan"
  gz_topic_name: "/pinky_02/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky_02/joint_states"
  gz_topic_name: "/pinky_02/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/pinky_02/imu_raw"
  gz_topic_name: "/pinky_02/imu_raw"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

