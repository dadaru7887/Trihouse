# 관제 UI와 FMS Gateway를 같은 origin에서 제공한다.
#
# UI는 Gateway origin을 페이지 origin으로 결정하므로, 브라우저가 보는 주소
# 하나 뒤에서 정적 번들과 Gateway API가 함께 서비스되어야 한다. 여기서 갈라
# 보내면 CORS도, credentialed cross-origin 설정도 필요 없다.

upstream fms_gateway {
    # compose 네트워크의 서비스 이름.
    server fms_gateway:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter 번들은 해시된 자산이라 오래 캐시해도 되지만, 진입점은 항상
    # 새로 받아야 배포 직후에도 옛 화면이 뜨지 않는다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store";
    }

    # 운영 이벤트 WebSocket. Upgrade 헤더를 그대로 넘겨야 한다.
    location /api/v1/operations/ws {
        proxy_pass http://fms_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 이벤트가 뜸해도 끊지 않는다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://fms_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 지도 소스 업로드가 커도 nginx가 먼저 자르지 않게 한다.
        client_max_body_size 256m;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://fms_gateway;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://fms_gateway;
        proxy_set_header Host $host;
    }

    # 나머지는 SPA 진입점으로 돌려준다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
