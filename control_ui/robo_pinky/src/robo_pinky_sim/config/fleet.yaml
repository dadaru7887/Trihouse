# Gazebo에 띄울 Pinky 플릿 정의.
#
# spawn_x / spawn_y 는 관제센터 좌표계(unit, 좌상단 원점, y↓)다.
# 통로 교차점 위에 놓아야 첫 경로 계획이 매끄럽다.
# zones 는 이 로봇이 진입 가능한 3온도 구획 — 관제 스케줄러의 입찰 자격이 된다.

