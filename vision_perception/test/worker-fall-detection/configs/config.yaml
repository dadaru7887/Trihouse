schema_version: 1
experiment:
  name: lego_yoloe_multiseed
  seeds: [17, 42, 101, 2026, 3407]
  continue_on_failure: true
dataset:
  data_yaml: dataset/raw_examples/data.yaml
  posture_manifest: null
  # 현재 raw_examples에는 자세 GT가 없으므로 탐지 학습은 허용하되 낙상 성능은 별도 GT 전까지 평가 불가로 표시한다.
  allow_posture_gap: true
  min_fallen_per_eval_split: 10
model:
  weights: 26s
  image_size: 640
training:
  epochs: 200
  patience: 20
  batch: -1
  workers: 8
  device: auto
  augmentation: true
  deterministic: true
evaluation:
  min_mask_recall: 0.90
  min_mask_map50: 0.80
  # 통계 보고를 위해 gate 실패 seed도 test하되 대표 모델 후보는 validation gate 통과 모델만 허용한다.
  test_all_seeds: true
output:
  run_root: runs/lego_worker
selection:
  metric: mask_map50_95
  tie_breaker: mask_recall
