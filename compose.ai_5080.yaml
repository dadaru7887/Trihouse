# Compose project for the RTX 5080 YOLO, VLM, and RL runtime.
name: trihouse_ai_5080

services:
  ai_runtime:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile.inference
    image: ${TRIHOUSE_AI_IMAGE:-trihouse_ai_5080:local}
    command: ["python", "-m", "vision_ai.robot.recovery.runtime"]
    restart: unless-stopped
    init: true
    shm_size: ${TRIHOUSE_AI_SHM_SIZE:-16gb}

    environment:
      TZ: Asia/Seoul

      # The 5080 sends records through the Gateway and never receives MySQL credentials.
      FMS_GATEWAY_URL: ${FMS_GATEWAY_URL:-http://host.docker.internal:8080}
      # PC2 always consumes the canonical PC1 MediaMTX URL, regardless of camera type.
      # There is deliberately no VISION_CAMERA_ID: the camera identity is the final
      # path segment of this URL, so the two cannot disagree. Reading is
      # account-authenticated, so this URL carries the viewer credential.
      VISION_RTSP_URL: ${VISION_RTSP_URL:?Set VISION_RTSP_URL to the PC1 MediaMTX stream}
      VISION_FRAME_WIDTH: ${VISION_FRAME_WIDTH:-1280}
      VISION_FRAME_HEIGHT: ${VISION_FRAME_HEIGHT:-720}
      VISION_INFERENCE_FPS: ${VISION_INFERENCE_FPS:-15}
      VLM_PROPOSAL_COOLDOWN_SECONDS: ${VLM_PROPOSAL_COOLDOWN_SECONDS:-8}
      VISION_CONFIDENCE: ${VISION_CONFIDENCE:-0.25}
      VISION_IMAGE_SIZE: ${VISION_IMAGE_SIZE:-640}
      VISION_PERSON_CLASS_ID: ${VISION_PERSON_CLASS_ID:-1}
      VISION_DEVICE: ${VISION_DEVICE:-cuda:0}
      RECOVERY_DEVICE_ID: ${RECOVERY_DEVICE_ID:?Set the DB device_id handled by this runtime}
      SEGMENTATION_WEIGHTS: /models/${SEGMENTATION_WEIGHTS_FILE:?Set SEGMENTATION_WEIGHTS_FILE}
      RECOVERY_POLICY_CHECKPOINT: /models/${RECOVERY_POLICY_CHECKPOINT_FILE:?Set RECOVERY_POLICY_CHECKPOINT_FILE}
      RECOVERY_POLICY_SHA256: ${RECOVERY_POLICY_SHA256:?Set the approved checkpoint SHA-256}
      # Optional distilled skill selector; both empty keeps goal-distance ranking.
      RECOVERY_SELECTOR_ENSEMBLE: ${RECOVERY_SELECTOR_ENSEMBLE:-}
      RECOVERY_SELECTOR_SHA256: ${RECOVERY_SELECTOR_SHA256:-}
      # Optional fallen classifier; both empty keeps the aspect-ratio rule.
      FALLEN_CLASSIFIER_BUNDLE: ${FALLEN_CLASSIFIER_BUNDLE:-}
      FALLEN_CLASSIFIER_SHA256: ${FALLEN_CLASSIFIER_SHA256:-}
      VLM_MODEL_REVISION: ${VLM_MODEL_REVISION:-main}
      # Every raw Qwen answer, kept on the artifacts volume (proposal vlm_lineage.response_id).
      VLM_RESPONSE_LOG: ${VLM_RESPONSE_LOG:-/artifacts/vlm_responses.jsonl}
      # robot/configs/vlm_prompts.yaml version; empty = its runtime_version. Same as --prompt-version.
      VLM_PROMPT_VERSION: ${VLM_PROMPT_VERSION:-}
      # Nav2 map yaml of the deployed map (its pgm beside it), mounted into the
      # container. Set: candidates heading into walls are dropped before approval.
      # Empty: walls are left to the robot's own pre-motion path check.
      RECOVERY_STATIC_MAP_YAML: ${RECOVERY_STATIC_MAP_YAML:-}
      VLM_RL_RUNTIME_MODE: physical
      VLM_RL_SAFETY_GATE_ENABLED: "true"
      VLM_RL_DEVICE: cuda
      RECOVERY_QUEUE_DIR: /var/lib/trihouse/recovery_queue
      RECOVERY_RETRY_INTERVAL_SECONDS: ${RECOVERY_RETRY_INTERVAL_SECONDS:-2}
      # operator_approved: 전 건 사람이 승인한다. 정책의 첫 실물 동작을 검증하는 기본값.
      # auto_bounded: Gateway 의 tier 규칙이 제한된 제안(대기 / 짧은 후진 / 우회)을
      # 스스로 승인하고, 사람·critical·반복 실패는 관제로 넘긴다. 승인 주체만
      # 넓어질 뿐 경로 검사와 로봇 admission, safety supervisor 는 그대로다.
      # 제안마다 policy_lineage.execution_mode 로 실려 가고, Gateway 는 그 값이
      # auto_bounded 인 제안만 자동 판정한다.
      VLM_RL_EXECUTION_MODE: ${VLM_RL_EXECUTION_MODE:-operator_approved}
      MODEL_DIR: /models
      ARTIFACT_DIR: /artifacts
      YOLO_CONFIG_DIR: /tmp/ultralytics

    extra_hosts:
      # This supports a one-host smoke test. On two servers, set FMS_GATEWAY_URL to the 4060 address.
      - host.docker.internal:host-gateway

    volumes:
      - "${TRIHOUSE_AI_MODEL_DIR:-./runtime/ai/models}:/models:ro"
      - "${TRIHOUSE_AI_ARTIFACT_DIR:-./runtime/ai/artifacts}:/artifacts"
      - "${TRIHOUSE_AI_QUEUE_DIR:-./runtime/ai/recovery_queue}:/var/lib/trihouse/recovery_queue"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# Physical runtime performs inference and acknowledged delivery only. Offline
# training is available exclusively through compose.ai_training.yaml.
