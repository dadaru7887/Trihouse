# 협로 Gazebo 검증 전용 스택. 운영/개발 MySQL과 Gateway를 전혀 공유하지 않는다.
name: trihouse_narrow_sim_test

services:
  mysql_test:
    image: mysql:8.4
    restart: "no"
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: trihouse_fms
      MYSQL_USER: fms_gateway
      MYSQL_PASSWORD: test_gateway_password
    ports:
      - "127.0.0.1:3307:3306"
    # 종료하면 DB 내용이 함께 사라진다. named DB volume을 만들지 않는다.
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./db/migrations/001_physical_v1_baseline.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/init/002_record_physical_baseline.sh:/docker-entrypoint-initdb.d/002_record_physical_baseline.sh:ro
      - ./db/migrations:/trihouse-migrations:ro
      - ./db/init/003_apply_physical_migrations.sh:/docker-entrypoint-initdb.d/003_apply_physical_migrations.sh:ro
      - ./db/seeds/seed_dev.sql:/docker-entrypoint-initdb.d/004_seed.sql:ro
      - ./db/init/003_grant_gateway_recovery.sh:/docker-entrypoint-initdb.d/005_grant_gateway_recovery.sh:ro
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  fms_gateway_test:
    build:
      context: .
      dockerfile: fms_gateway/Dockerfile
    image: trihouse_fms_gateway:narrow-sim-test
    restart: "no"
    init: true
    environment:
      TZ: Asia/Seoul
      FMS_DB_HOST: mysql_test
      FMS_DB_PORT: 3306
      FMS_DB_DATABASE: trihouse_fms
      FMS_DB_USER: fms_gateway
      FMS_DB_PASSWORD: test_gateway_password
      FMS_DB_POOL_SIZE: 2
      FMS_TCP_ENABLED: "false"
      FMS_MAP_RUNTIME_ROOT: /app/runtime
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - narrow_sim_map_runtime:/app/runtime
    depends_on:
      mysql_test:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  narrow_sim_map_runtime:
