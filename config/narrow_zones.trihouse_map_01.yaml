# 협로 규칙 주행 존 표 — trihouse_map_01 전용.
#
# Nav2 가 통과하지 못하는 도크 앞 좁은 통로를 규칙 기반으로 지난다. 통로 폭 0.20 m 에
# 로봇 필요 폭 0.14 m 라 편측 여유가 0.03 m 인데, AMCL 위치추정 오차는 0.08~0.11 m 다.
# 절대 좌표로는 지날 수 없어 진입점에서의 상대 이동으로 간다.
#
# **파일 이름에 지도가 박혀 있다.** 값이 그 지도 좌표계에 묶여 있기 때문이다. 지도를
# 다시 그리면 전부 다시 재야 한다 — docs/runbooks/p0-narrow-zone-measurement.md
#
# 아래 값은 `dev_driving/driving_fms/narrow3_rule_based_docking.py` 의 2026-08-15
# 실측이다. **이 지도에서 검증되지 않았다.** 먼저 그대로 돌려 보고 어긋나는 것만 다시
# 잰다. 재측정하면 measured 를 갱신한다.
#
# 이 층은 임시다. 마커 도킹(docs/architecture/marker-docking-design.md)이 붙으면
# 걷어낸다 — 그쪽은 마커 상대 좌표라 지도가 바뀌어도 동작한다.
#
# 2026-08-19 수정: zone 직사각형이 너무 작아 **도크를 덮지 못했다.** 그러면 도크에
# 선 로봇이 다음 명령을 받아도 `zone_containing` 이 존을 못 찾아 빠져나오기 시퀀스가
# 돌지 않는다 — 창고에 갇힌다. enter 시퀀스가 끝나는 자리를 적분해 그 자리가 들어갈
# 크기로 넓혔다. test_every_shipped_zone_table_fits_its_own_map 이 이제 지킨다.

map_name: trihouse_map_01

# 시퀀스 스텝. 거리는 m, 각도는 rad(map 프레임 절대각).
#   [rotate,    yaw]        제자리 회전
#   [straight,  distance]   현재 방향으로 이동. 음수면 후진
#   [exit_zone, null]       존 직사각형을 벗어날 때까지 전진
zones:
  ambient_storage_loading_dock_01:
    entry: { x: 1.010244, y: 0.916734, yaw: -0.086755 }
    zone:  { length: 0.67, width: 0.37 }
    enter:
      - [rotate, -2.805721]
      - [straight, -0.30]
    exit:
      - [straight, 0.30]
      - [rotate, -3.130293]
      - [exit_zone, null]
    measured:
      date: 2026-08-15
      source: narrow_1
      stddev_x: 0.109
      stddev_y: 0.060
      stddev_yaw: 0.185
      note: 상온구역. 진입이 비교적 직선이라 [회전 -> 후진] 2단계.

  # 이 지도에서 이 진입점의 벽 여유는 0.05 m 이고 도크까지의 최선 통로는 0.10 m 다.
  # 로봇 폭 0.12 m / 필요 통로 0.14 m 에 못 미친다 — **이 지도에서는 쓸 수 없는 값**이다.
  # 좌표는 실측이므로 지우지 않는다. 쓰려면 통로부터 다시 그려야 한다.
  # (2026-08-19 확인)
  chilled_storage_loading_dock_01:
    entry: { x: 1.101332, y: -0.100451, yaw: 3.102934 }
    zone:  { length: 0.59, width: 0.50 }
    enter:
      - [rotate, 2.418911]
      - [straight, -0.30]
    exit:
      - [straight, 0.30]
      - [rotate, -3.130293]
      - [exit_zone, null]
    measured:
      date: 2026-08-15
      source: narrow_2
      stddev_x: 0.115
      stddev_y: 0.069
      stddev_yaw: 0.227
      note: >-
        냉장구역. 회전/거리값은 narrow_1 것을 그대로 재사용했고 원본에도
        "미검증 -- 다음에 확인 필요" 로 적혀 있다. 셋 중 신뢰도가 가장 낮다.

  frozen_storage_loading_dock_01:
    entry: { x: 0.919804, y: -1.189253, yaw: -0.032430 }
    zone:  { length: 0.27, width: 0.75 }
    enter:
      - [straight, 0.10]
      - [rotate, -1.525323]
      - [straight, -0.315]
    exit:
      - [straight, 0.315]
      - [rotate, -2.999133]
      - [exit_zone, null]
    measured:
      date: 2026-08-15
      source: narrow_3
      stddev_x: 0.158
      stddev_y: 0.043
      stddev_yaw: 0.305
      note: >-
        냉동구역. 셋 중 유일하게 [직진 -> 회전 -> 후진] 3단계로 실측 확정된 것이다.
        원본 저자가 이 코너에서 Nav2 로 가장 오래 씨름했다.
