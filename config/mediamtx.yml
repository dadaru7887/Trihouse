# MediaMTX 인가 정책 (PC1, RTX 4060 호스트).
#
# 이 파일을 마운트하지 않으면 MediaMTX 는 익명 publish / read / playback 을
# 모두 허용하는 기본값으로 뜬다. Pinky 가 원격에서 publish 해야 하므로 8554 는
# LAN 에 열려 있고, 따라서 설정이 없다는 것은 LAN 의 아무 호스트나 스트림을
# 덮어쓰거나 들여다볼 수 있다는 뜻이다.
#
# ── publish 는 IP 로, read 는 계정으로 막는다 ─────────────────────────────
# 두 방향의 비용이 다르다. RTSP 는 자격 증명을 URL 안에만 실을 수 있어서,
# publish 를 계정으로 막으면 비밀번호가 로봇의 package-share YAML 과 `ps`
# 출력에 노출된다. 반면 read 쪽은 PC2 가 이미 `VISION_RTSP_URL` 을 환경변수로
# 받으므로 비밀번호를 붙여도 코드가 한 줄도 바뀌지 않는다. 그래서 publish 는
# 출발지 IP 허용목록으로, read 는 계정으로 막는다.
#
# 감수하는 비용: 로봇 주소를 DHCP 예약으로 고정해야 하고, IP 위장은 막지
# 못한다.
#
# ── 아래 IP 는 전부 자리표시자다 ──────────────────────────────────────────
# 192.0.2.0/24 는 RFC 5737 이 문서용으로 예약한 대역이라 실제 호스트가 존재할
# 수 없다. 즉 이 파일을 그대로 배포하면 publish 가 전부 거절된다(fail closed).
# 실제 주소는 이 파일을 고치는 대신 `.env` 에 적고 Compose 가 아래 환경변수로
# 주입한다. `${...}` 문법은 쓰지 않는다 — MediaMTX 1.19.3 은 설정 파일 안의
# `${VAR}` 를 전개하지 않고 문자열 그대로 저장하므로, 그렇게 적으면 비밀번호가
# 조용히 `${MTX_VIEWER_PASS}` 라는 고정 문자열이 되어 버린다.
#
#   authInternalUsers 색인 → 환경변수 (색인은 아래 목록 순서다. 순서를 바꾸면
#   Compose 의 주입 대상도 같이 바꿔야 한다.)
#     [0] pinky/CAM-PK-01      MTX_AUTHINTERNALUSERS_0_IPS  <- PK_01 (로봇)
#     [1] pinky/CAM-PK-02      MTX_AUTHINTERNALUSERS_1_IPS  <- PK_02 (로봇)
#     [2] omx/CAM-OMX-01-WRIST MTX_AUTHINTERNALUSERS_2_IPS  <- OMX_01 이 붙은 일반 PC
#     [3] omx/CAM-OMX-02-WRIST MTX_AUTHINTERNALUSERS_3_IPS  <- OMX_02 이 붙은 일반 PC
#     [4] fixed/CAM-FIXED-01   MTX_AUTHINTERNALUSERS_4_IPS  <- 4060 (USB)
#     [5] fixed/CAM-FIXED-02   MTX_AUTHINTERNALUSERS_5_IPS  <- 4060 (USB)
#     [6] viewer               MTX_AUTHINTERNALUSERS_6_PASS
#     [7] localhost 관리자     (주입 없음)

logLevel: info

# TCP 만 쓴다. 방화벽 규칙이 단순해지고 호스트 간 검증 결과가 결정적이 된다.
rtsp: yes
rtspTransports: [tcp]

# 이 경계에서 필요한 것은 RTSP 하나뿐이다. 나머지 서버는 열어 둘 이유가 없다.
rtmp: no
srt: no

hls: yes
webrtc: yes

api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998
playback: yes
playbackAddress: :9996

###############################################
# 인가

authMethod: internal

authInternalUsers:
  # [0] PK_01 주행 카메라. 로봇이 직접 publish 한다.
  - user: any
    pass:
    ips: [192.0.2.11]
    permissions:
      - action: publish
        path: pinky/CAM-PK-01

  # [1] PK_02 주행 카메라.
  - user: any
    pass:
    ips: [192.0.2.12]
    permissions:
      - action: publish
        path: pinky/CAM-PK-02

  # [2] OMX_01 손목 카메라. PC1 에 USB 로 붙어 있으므로 PC1 이 publish 한다.
  - user: any
    pass:
    ips: [192.0.2.10]
    permissions:
      - action: publish
        path: omx/CAM-OMX-01-WRIST

  # [3] OMX_02 손목 카메라.
  - user: any
    pass:
    ips: [192.0.2.10]
    permissions:
      - action: publish
        path: omx/CAM-OMX-02-WRIST

  # [4] 창고 고정 카메라 1.
  - user: any
    pass:
    ips: [192.0.2.10]
    permissions:
      - action: publish
        path: fixed/CAM-FIXED-01

  # [5] 창고 고정 카메라 2.
  - user: any
    pass:
    ips: [192.0.2.10]
    permissions:
      - action: publish
        path: fixed/CAM-FIXED-02

  # [6] 유일한 열람 계정. PC2 추론과 연구용 호스트가 같은 계정을 쓴다.
  #     비밀번호는 이 파일에 적지 않는다. Compose 가 주입한다.
  #     `ips` 를 비워 두는 것은 의도다. 연구용 GPU PC 주소가 아직 확정되지
  #     않았고, read 는 이미 비밀번호로 막혀 있다.
  - user: viewer
    pass:
    ips: []
    permissions:
      - action: read
      - action: playback

  # [7] localhost 관리자. API·metrics·pprof 를 인증 없이 쓰되 루프백에서만
  #     가능하다. 이 포트들은 Compose 에서도 127.0.0.1 로만 노출된다.
  - user: any
    pass:
    ips: [127.0.0.1, '::1']
    permissions:
      - action: api
      - action: metrics
      - action: pprof

###############################################
# 녹화

# 녹화본은 감사 기록이면서 동시에 분할 학습 코퍼스다. 연구 경로가 이 녹화본을
# 쓰기 때문에 학습 데이터가 운영 추론과 같은 인코딩 사슬을 지난다(D5).
# 개별 값은 `MTX_PATHDEFAULTS_RECORD*` 로 덮어쓸 수 있고, Compose 가 `.env` 의
# TRIHOUSE_RECORD_* 를 그 이름으로 넘긴다.
pathDefaults:
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordSegmentDuration: 60s
  recordDeleteAfter: 168h

###############################################
# 경로

# MediaMTX 는 `paths` 에 없는 경로를 400 으로 거절한다. 마운트한 설정이 기본
# 설정을 통째로 대체하므로 이 절을 빠뜨리면 인가가 아무리 옳아도 스트림이
# 하나도 붙지 않는다. `all_others` 를 두지 않는 것은 의도다 — 등록되지 않은
# 경로는 인가 이전에 존재 자체가 거절된다.
#
# 목록은 `config/cameras.yaml` 에서 파생된 사본이고,
# `test_vision_compose_contract.py` 가 정본과 대조한다.
paths:
  pinky/CAM-PK-01:
  pinky/CAM-PK-02:
  omx/CAM-OMX-01-WRIST:
  omx/CAM-OMX-02-WRIST:
  fixed/CAM-FIXED-01:
  fixed/CAM-FIXED-02:
