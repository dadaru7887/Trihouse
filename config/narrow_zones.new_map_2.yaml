# new_map_2 전용 저속 협로 표.
#
# 충전 베이는 시작점 바로 앞의 벽 여유가 작다. 따라서 어떤 주문이든 일반 Nav2 를
# 먼저 보내지 않고, 두 출발 waypoint가 공유하는 하나의 narrow_4 탈출 규칙을 실행한
# 다음 Nav2를 시작한다. 규칙 속도는 fleet_node -> cmd_vel_dock -> safety supervisor를
# 거쳐 최종 cmd_vel로 전달된다.
map_name: new_map_2

zones:
  # 창고 entry는 Nav2가 규칙 제어에 넘길 map pose이고, zone은 도킹 뒤 로봇을
  # 포함하는 출발 감지 영역이다. ArUco marker 없이 enter/exit 고정 규칙만 사용한다.
  ambient_storage_loading_dock_01:
    enabled: true
    # 2026-08-15 narrow_1 실측 시작점. 지도 waypoint `ambient_storage_narrow_entry`
    # 와 같은 자리다 (stddev x=10.9cm / y=6.0cm / yaw=10.6deg).
    #
    # 2026-08-23 에 이 값이 (0.911748, 0.775876, yaw 0.875202) 로 바뀌어 있었는데,
    # 그 yaw 는 자기 dock_target 방위(19.24deg)와 30.9deg 어긋나 있었다. 아래
    # doorway.yaw 는 그때 함께 고쳐지지 않아 원래 값 0.33587 을 그대로 갖고 있었고,
    # 그 불일치가 2026-08-24 실기에서 Nav2 가 도달 불가능한 yaw 를 맞추려 제자리
    # 회전만 반복하는 것으로 나타났다. 실측 원본으로 되돌린다.
    entry: { x: 1.010244055594586, y: 0.9167344977253539, yaw: -0.08675495954950327 }
    entry_zone:
      { x: 1.010244055594586, y: 0.9167344977253539, yaw: -0.08675495954950327, length: 0.05, width: 0.20 }
    # entry 에 아래 enter 시퀀스를 적분한 값이다. 손으로 적지 않는다 — 따로 적어
    # 두면 시퀀스를 고쳤을 때 둘이 갈라지고, 그 갈라짐은 "도크에 못 들어간다" 로만
    # 보여 원인에서 멀다.
    zone: { x: 1.293481094178777, y: 1.0156120986977553, yaw: -2.805721254488808, length: 0.20, width: 0.20 }
    dock_target: { x: 1.293481094178777, y: 1.0156120986977553, yaw: -2.805721254488808 }
    # doorway는 entry와 dock_target의 중점이고, 그 yaw 는 entry->dock 방위다.
    # 2026-08-24 제거: entry_passage 가 있으면 fleet 가 warehouse_entry
    # (출입구를 앞으로 통과) 전략을 고른다. 이 도크의 실측 절차는
    # 회전 뒤 후진이고, 앞으로 밀고 들어가면 범퍼 앞 여유가 0.046 m
    # (한 번은 -0.006 m)까지 좁아져 front_stop 으로 매번 막혔다.
    # 냉동은 처음부터 이 블록이 없고 아래 enter 시퀀스로 도킹한다.
    # 되돌리려면 backup-ops-20260824-b 를 참고한다.
    enter:
      - [rotate, -2.805721254488808]
      - [straight, -0.30]
    exit:
      - [straight, 0.30]
      - [rotate, -3.130293455959265]
      - [exit_zone, null]
    exit_target: { x: 1.010244055594586, y: 0.9167344977253539, yaw: -3.130293455959265 }
    measured:
      source: narrow_1_2026-08-15_measured
      entry_pose: true
      dock_pose: true
      enter: true
      exit: true
      entry_pose_date: 2026-08-15
      note: >-
        2026-08-15 narrow_1 실측 원본으로 되돌린 값이다. exit 시퀀스는 entry 로
        정확히 되돌아온다(오차 0). dock_target 은 enter 시퀀스를 적분한 값이며
        2026-08-24 실기에서 검증한다.

  chilled_storage_loading_dock_01:
    enabled: true
    # narrow_2 실측 시작점. 지도 waypoint `chilled_storage_narrow_entry` 와 같은
    # 자리다.
    #
    # 2026-08-23 에 이 값이 (0.785906, 0.875245, yaw 0.874465) 로 바뀌어 있었다.
    # 그 자리에서 아래 enter 시퀀스를 적분하면 dock_target 에서 1.025 m 빗나간다.
    # 원래 값으로 되돌리면 오차가 0.0000000000 m 로 정확히 떨어진다 — 즉
    # dock_target 은 원래 이 entry 에서 유도된 값이고, entry 만 덮어써졌다.
    # 상온에서 일어난 것과 같은 편집이다.
    entry: { x: 1.101331522128124, y: -0.10045055614140724, yaw: 3.1029342608092607 }
    entry_zone:
      { x: 1.101331522128124, y: -0.10045055614140724, yaw: 3.1029342608092607, length: 0.05, width: 0.20 }
    zone: { x: 1.3263418779273253, y: -0.2988701614809928, yaw: 2.4189105956431427, length: 0.20, width: 0.20 }
    dock_target: { x: 1.3263418779273253, y: -0.2988701614809928, yaw: 2.4189105956431427 }
    # doorway는 entry와 dock_target의 중점이고, 그 yaw 는 entry->dock 방위다.
    # 덮어써진 entry 로 계산되어 있던 값(중점 1.0561/0.2882, yaw -1.1394)을 버리고
    # 되돌린 entry 로 다시 계산했다.
    # 2026-08-24 제거: entry_passage 가 있으면 fleet 가 warehouse_entry
    # (출입구를 앞으로 통과) 전략을 고른다. 이 도크의 실측 절차는
    # 회전 뒤 후진이고, 앞으로 밀고 들어가면 범퍼 앞 여유가 0.046 m
    # (한 번은 -0.006 m)까지 좁아져 front_stop 으로 매번 막혔다.
    # 냉동은 처음부터 이 블록이 없고 아래 enter 시퀀스로 도킹한다.
    # 되돌리려면 backup-ops-20260824-b 를 참고한다.
    enter:
      - [rotate, 2.4189105956431427]
      - [straight, -0.30]
    exit:
      - [straight, 0.30]
      - [rotate, -3.130293455959265]
      - [exit_zone, null]
    exit_target: { x: 1.101331522128124, y: -0.10045055614140724, yaw: -3.130293455959265 }
    measured:
      source: narrow_2_restored_from_dock_target
      entry_pose: true
      dock_pose: true
      enter: true
      exit: true
      entry_pose_date: 2026-08-15
      note: >-
        entry 를 지도 waypoint `chilled_storage_narrow_entry` 로 되돌렸다. 그때
        enter 시퀀스 적분값이 dock_target 과 오차 0.0000000000 m 로 일치한다.
        exit 시퀀스도 entry 로 정확히 되돌아온다. 2026-08-24 실기에서 검증한다.

  frozen_storage_loading_dock_01:
    # j_narrow3_rule_based_docking_1.py의 narrow_3 실측값을 그대로 사용한다.
    # Nav2는 이 입구까지만 오고, 아래 고정 규칙이 냉동 도크까지 주차한다.
    entry: { x: 0.9198039894575488, y: -1.1892528962848725, yaw: -0.03242978898931081 }
    # EN: Nav2 yields control anywhere in this oriented box. Rule control then
    # closes the remaining position and yaw error against `entry`.
    # KO: Nav2는 이 회전 직사각형 안에서 제어권을 넘긴다. 남은 위치와 yaw 오차는
    # 규칙 제어가 `entry` 값에 맞춘다.
    entry_zone:
      { x: 0.9198039894575488, y: -1.1892528962848725, yaw: -0.03242978898931081, length: 0.10, width: 0.20 }
    # 도킹 뒤 로봇이 머무르는 직사각형. entry와 분리해야 다음 출발 명령에서
    # 역순 탈출 시퀀스를 선택할 수 있다.
    # 원본에는 별도 dock 좌표가 없으므로 entry에서 원본 sequence를 적분한 예상값이다.
    zone: { x: 1.036067117750, y: -0.933812857015, yaw: -0.9057963267948966, length: 0.20, width: 0.20 }
    dock_target: { x: 1.036067117750, y: -0.933812857015, yaw: -0.9057963267948966 }
    enter:
      - [straight, 0.325]
      - [rotate, -0.9057963267948966]
      - [straight, -0.338]
    # 원본 Python의 sequence_exit를 그대로 옮긴다.
    exit:
      - [straight, 0.315]
      - [rotate, -2.999132807834344]
      - [exit_zone, null]
    # exit_zone의 종료 좌표는 원본에 없으므로 실측 전까지 entry 중심을 검증 후보로 둔다.
    exit_target: { x: 0.9198039894575488, y: -1.1892528962848725, yaw: -2.999132807834344 }
    measured:
      source: /home/newuser/Downloads/j_narrow3_rule_based_docking_1.py
      entry_pose: true
      dock_pose: true
      enter: true
      exit: true
      entry_pose_date: 2026-08-15
      note: >-
        narrow_3 원본값: 0.325 m 직진, yaw -0.9057963267948966 rad로 회전,
        0.338 m 후진. dock_target은 이 시퀀스를 적분한 예상값이므로 이번 실기에서 검증한다.

  charging_narrow_departure:
    # 두 대기/충전 waypoint는 하나의 narrow_4 탈출 상태를 공유한다. 아래 반경은
    # 출발 트리거일 뿐 별개의 물리 협로 zone이 아니다.
    enabled: true
    approach_required: false
    departure_triggers:
      - { name: start_zone_1, x: 0.171, y: 0.202, radius: 0.30 }
      - { name: start_zone_2, x: 0.076, y: -0.013, radius: 0.30 }
    entry: null
    zone: null
    enter: []
    exit:
      - [straight, 0.70]
    dock_target: null
    exit_target: { x: 0.7992961442, y: 0.0854053105, yaw: 0.0923642279 }
    # 실측점 반경에 먼저 들어오면 0.70 m를 모두 채우기 전이라도 즉시 정지한다.
    exit_completion_radius: 0.15
    measured:
      exit: true
      date: 2026-08-22
      source: j_narrow3_rule_based_docking_1.py_and_waypoint.md_pk02_amcl
      note: >-
        start_zone_1/2 반경 0.30 m 안에서 다음 주문을 받으면 0.70 m 저속 직진한 뒤,
        실측 exit_target 허용 반경을 확인하고 원래 주문 목적지의 Nav2를 시작한다.
