# P0가 등록하는 여섯 개 카메라 fixture.
#
# P0는 카메라 여섯 대를 물리적으로 연결하지 않는다. 여기 있는 값은 등록
# 정보와 fixture MediaMTX 경로뿐이다. `map_pose`는 P1 캘리브레이션 전까지
# 측정되지 않았으므로 좌표를 지어내지 않고 생략한다. 이 목록은 발행 시
# `map_revisions.manifest.cameras`에 그대로 실린다.
cameras:
  - camera_id: CAM-PK-01
    role: pinky_travel
    attached_to: PK_01
    mediamtx_path: fixtures/pinky_01_travel
    map_pose: null
  - camera_id: CAM-PK-02
    role: pinky_travel
    attached_to: PK_02
    mediamtx_path: fixtures/pinky_02_travel
    map_pose: null
  - camera_id: CAM-OMX-01-WRIST
    role: omx_wrist
    attached_to: OMX_01
    mediamtx_path: fixtures/omx_01_wrist
    map_pose: null
  - camera_id: CAM-OMX-02-WRIST
    role: omx_wrist
    attached_to: OMX_02
    mediamtx_path: fixtures/omx_02_wrist
    map_pose: null
  - camera_id: CAM-FIXED-01
    role: warehouse_fixed
    attached_to: null
    mediamtx_path: fixtures/warehouse_fixed_01
    map_pose: null
  - camera_id: CAM-FIXED-02
    role: warehouse_fixed
    attached_to: null
    mediamtx_path: fixtures/warehouse_fixed_02
    map_pose: null
