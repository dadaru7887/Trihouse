[pytest]
# 여러 패키지가 `tests` 라는 같은 디렉터리 이름을 쓰므로 기본 prepend 모드로는
# 한 번에 수집할 수 없다. importlib 모드는 파일 경로로 모듈을 적재하므로
# db/tests, control_tower/tests, trihouse_omx_adapter/tests, vision_ai/tests,
# tests 를 한 명령으로 함께 돌릴 수 있다.
addopts = --import-mode=importlib
markers =
    simulation: requires an explicitly started Gazebo simulation runtime
    integration: requires a real MySQL 8 server
    hardware: requires a physical robot, sensor, or host
