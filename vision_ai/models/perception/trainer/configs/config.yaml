schema_version: 1
experiment:
  name: lego_yoloe_multiseed
  seeds: [17, 42, 101, 2026, 3407]
  continue_on_failure: true
dataset:
  # PLACEHOLDER — 실재하는 경로가 아니다. 반드시 --data 로 넘기거나
  # 이 값을 자기 데이터셋 경로로 바꾼다. 상대 경로는 저장소 루트 기준.
  data_yaml: PLACEHOLDER/replace_with_your_dataset/data.yaml
  posture_manifest: null
  # 현재 raw_examples에는 자세 GT가 없으므로 탐지 학습은 허용하되 낙상 성능은 별도 GT 전까지 평가 불가로 표시한다.
  allow_posture_gap: true
  min_fallen_per_eval_split: 10
model:
  # 축약어를 쓰지 않는다. ultralytics 가 찾는 파일명 그대로 적는다.
  weights: yoloe-26s-seg.pt
  image_size: 640
training:
  epochs: 200
  patience: 20
  batch: -1
  workers: 8
  device: auto
  augmentation: true
  augmentation_seed: 42
  deterministic: true
evaluation:
  min_mask_recall: 0.70
  min_mask_map50: 0.60
  # 통계 보고를 위해 gate 실패 seed도 test하되 대표 모델 후보는 validation gate 통과 모델만 허용한다.
  test_all_seeds: true
output:
  run_root: runs/lego_worker
selection:
  metric: person_mask_map50_95
  tie_breaker: person_mask_recall
