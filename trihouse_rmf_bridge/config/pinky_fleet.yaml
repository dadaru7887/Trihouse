# Open-RMF EasyFullControl용 실물 Pinky 초기 설정.
# physical_validation_required: footprint, 속도/가속도, 배터리/기계 계수는
# 2026-08-12 실측 뒤 보수적인 방향으로 보정해야 한다.
rmf_fleet:
  name: "pinky_fleet"
  limits:
    # Nav2 현재 max_velocity 0.25 m/s를 초과하지 않는 초기값이다.
    linear: [0.250, 0.500]
    angular: [1.500, 2.000]
  profile:
    # Nav2 0.12 m 정사각 footprint의 외접 반경을 올림한 값이다.
    footprint: 0.090
    vicinity: 0.150
  reversible: true
  battery_system:
    voltage: 12.000
    capacity: 24.000
    charging_current: 5.000
  mechanical_system:
    mass: 20.000
    moment_of_inertia: 10.000
    friction_coefficient: 0.220
  ambient_system:
    power: 20.000
  tool_system:
    power: 0.000
  recharge_threshold: 0.100
  recharge_soc: 1.000
  publish_fleet_state: 10.0
  account_for_battery_drain: true
  task_capabilities:
    loop: true
    delivery: true
  actions: []
  finishing_request: "charge"
  responsive_wait: true
  reassign_task_interval: 120
  robots:
    PK-01:
      # 현재 gwanghee navigation graph의 is_charger waypoint 이름과 동일하다.
      charger: "충전1"

fleet_manager:
  ip: "127.0.0.1"
  port: 22011
