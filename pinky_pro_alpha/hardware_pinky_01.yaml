pinky_01:
  amcl:
    ros__parameters:
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: pinky_01/base_footprint
      beam_skip_distance: 0.5
      beam_skip_error_threshold: 0.9
      beam_skip_threshold: 0.3
      do_beamskip: false
      global_frame_id: map
      lambda_short: 0.1
      laser_likelihood_max_dist: 2.0
      laser_max_range: 100.0
      laser_min_range: -1.0
      laser_model_type: likelihood_field
      max_beams: 60
      max_particles: 2000
      min_particles: 500
      odom_frame_id: pinky_01/odom
      pf_err: 0.05
      pf_z: 0.99
      recovery_alpha_fast: 0.0
      recovery_alpha_slow: 0.0
      resample_interval: 1
      robot_model_type: nav2_amcl::DifferentialMotionModel
      save_pose_rate: 0.5
      sigma_hit: 0.2
      tf_broadcast: true
      transform_tolerance: 1.0
      update_min_a: 0.1
      update_min_d: 0.15
      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05
      scan_topic: /pinky_01/scan
      set_initial_pose: true
      initial_pose:
        x: 0.911748152598201
        y: 0.77587646431032
        z: 0.0
        yaw: 0.875201645910827
  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: pinky_01/base_link
      odom_topic: /pinky_01/odom
      bt_loop_duration: 10
      default_server_timeout: 20
      wait_for_service_timeout: 10000
      action_server_result_timeout: 900.0
      navigators:
      - navigate_to_pose
      - navigate_through_poses
      navigate_to_pose:
        plugin: nav2_bt_navigator::NavigateToPoseNavigator
      navigate_through_poses:
        plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      error_code_names:
      - compute_path_error_code
      - follow_path_error_code
  controller_server:
    ros__parameters:
      /bond_disable_heartbeat_timeout: true
      FollowPath:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        stateful: true
        desired_linear_vel: 0.2
        allow_reversing: false
        max_angular_accel: 3.2
        lookahead_dist: 0.6
        use_velocity_scaled_lookahead_dist: true
        lookahead_time: 1.5
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
        curvature_lookahead_dist: 0.6
        use_fixed_curvature_lookahead: false
        use_rotate_to_heading: true
        rotate_to_heading_min_angle: 0.35
        rotate_to_heading_angular_vel: 1.0
        use_regulated_linear_velocity_scaling: false
        regulated_linear_scaling_min_radius: 0.5
        regulated_linear_scaling_min_speed: 0.05
        use_cost_regulated_linear_velocity_scaling: true
        cost_scaling_dist: 0.6
        cost_scaling_gain: 1.5
        inflation_cost_scaling_factor: 3.0
        approach_velocity_scaling_dist: 0.6
        min_approach_linear_velocity: 0.05
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        max_robot_pose_search_dist: 1.4875
        transform_tolerance: 0.2
        use_cancel_deceleration: false
        cancel_deceleration: 3.2
        interpolate_curvature_after_goal: false
      controller_plugins:
      - FollowPath
      controller_frequency: 20.0
      action_server_result_timeout: 10.0
      autostart_node: false
      bond_heartbeat_period: 0.1
      costmap_update_timeout: 0.3
      enable_stamped_cmd_vel: false
      failure_tolerance: 0.3
      publish_zero_velocity: true
      speed_limit_topic: speed_limit
      odom_topic: /pinky_01/odom
      use_realtime_priority: false
      use_sim_time: false
      start_type_description_service: true
      min_theta_velocity_threshold: 0.001
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      goal_checker_plugins:
      - general_goal_checker
      general_goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        stateful: true
        xy_goal_tolerance: 0.1
        yaw_goal_tolerance: 0.25
      progress_checker_plugins:
      - progress_checker
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        movement_time_allowance: 10.0
        required_movement_radius: 0.5
  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: pinky_01/odom
        robot_base_frame: pinky_01/base_footprint
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.03
        footprint: '[[0.04, 0.06], [0.04, -0.06], [-0.16, -0.06], [-0.16, 0.06]]'
        plugins:
        - voxel_layer
        - inflation_layer
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 10.0
          inflation_radius: 0.5
        voxel_layer:
          plugin: nav2_costmap_2d::VoxelLayer
          enabled: true
          publish_voxel_map: true
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          observation_sources: scan
          scan:
            topic: /pinky_01/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        always_send_full_costmap: true
  global_costmap:
    global_costmap:
      ros__parameters:
        footprint_padding: 0.03
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: pinky_01/base_footprint
        footprint: '[[0.04, 0.06], [0.04, -0.06], [-0.16, -0.06], [-0.16, 0.06]]'
        resolution: 0.03
        track_unknown_space: true
        plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /pinky_01/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 10.0
          inflation_radius: 0.5
        always_send_full_costmap: true
  map_saver:
    ros__parameters:
      save_map_timeout: 5.0
      free_thresh_default: 0.25
      occupied_thresh_default: 0.65
      map_subscribe_transient_local: true
  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins:
      - GridBased
      costmap_update_timeout: 1.0
      GridBased:
        plugin: nav2_navfn_planner::NavfnPlanner
        tolerance: 0.5
        use_astar: false
        allow_unknown: true
  smoother_server:
    ros__parameters:
      smoother_plugins:
      - simple_smoother
      simple_smoother:
        plugin: nav2_smoother::SimpleSmoother
        tolerance: 1.0e-10
        max_its: 1000
        do_refinement: true
  behavior_server:
    ros__parameters:
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - assisted_teleop
      - wait
      spin:
        plugin: nav2_behaviors::Spin
      backup:
        plugin: nav2_behaviors::BackUp
      drive_on_heading:
        plugin: nav2_behaviors::DriveOnHeading
      wait:
        plugin: nav2_behaviors::Wait
      assisted_teleop:
        plugin: nav2_behaviors::AssistedTeleop
      local_frame: pinky_01/odom
      global_frame: map
      robot_base_frame: pinky_01/base_footprint
      transform_tolerance: 0.1
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2
      enable_stamped_cmd_vel: false
  slam_toolbox:
    ros__parameters:
      solver_plugin: solver_plugins::CeresSolver
      ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
      ceres_preconditioner: SCHUR_JACOBI
      ceres_trust_strategy: LEVENBERG_MARQUARDT
      ceres_dogleg_type: TRADITIONAL_DOGLEG
      ceres_loss_function: None
      odom_frame: odom
      map_frame: map
      base_frame: pinky_01/base_footprint
      scan_topic: /pinky_01/scan
      mode: mapping
      debug_logging: false
      throttle_scans: 1
      transform_publish_period: 0.02
      map_update_interval: 5.0
      resolution: 0.03
      max_laser_range: 10.0
      minimum_time_interval: 0.5
      transform_timeout: 0.4
      tf_buffer_duration: 30.0
      stack_size_to_use: 40000000
      enable_interactive_mode: true
      use_scan_matching: true
      use_scan_barycenter: true
      minimum_travel_distance: 0.5
      minimum_travel_heading: 0.5
      scan_buffer_size: 10
      scan_buffer_maximum_scan_distance: 8.0
      link_match_minimum_response_fine: 0.1
      link_scan_maximum_distance: 1.5
      loop_search_maximum_distance: 3.0
      do_loop_closing: true
      loop_match_minimum_chain_size: 10
      loop_match_maximum_variance_coarse: 3.0
      loop_match_minimum_response_coarse: 0.35
      loop_match_minimum_response_fine: 0.45
      correlation_search_space_dimension: 0.5
      correlation_search_space_resolution: 0.01
      correlation_search_space_smear_deviation: 0.1
      loop_search_space_dimension: 8.0
      loop_search_space_resolution: 0.05
      loop_search_space_smear_deviation: 0.03
      distance_variance_penalty: 0.5
      angle_variance_penalty: 1.0
      fine_search_angle_offset: 0.00349
      coarse_search_angle_offset: 0.349
      coarse_angle_resolution: 0.0349
      minimum_angle_penalty: 0.9
      minimum_distance_penalty: 0.5
      use_response_expansion: true
  waypoint_follower:
    ros__parameters:
      loop_rate: 20
      stop_on_failure: false
      action_server_result_timeout: 900.0
      waypoint_task_executor_plugin: wait_at_waypoint
      wait_at_waypoint:
        plugin: nav2_waypoint_follower::WaitAtWaypoint
        enabled: true
        waypoint_pause_duration: 200
  velocity_smoother:
    ros__parameters:
      smoothing_frequency: 20.0
      scale_velocities: false
      feedback: OPEN_LOOP
      max_velocity:
      - 0.25
      - 0.0
      - 1.5
      min_velocity:
      - -0.25
      - 0.0
      - -1.5
      max_accel:
      - 2.5
      - 0.0
      - 3.2
      max_decel:
      - -2.5
      - 0.0
      - -3.2
      odom_topic: /pinky_01/odom
      odom_duration: 0.1
      deadband_velocity:
      - 0.0
      - 0.0
      - 0.0
      velocity_timeout: 1.0
      enable_stamped_cmd_vel: false
  collision_monitor:
    ros__parameters:
      base_frame_id: pinky_01/base_footprint
      odom_frame_id: pinky_01/odom
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: cmd_vel
      state_topic: collision_monitor_state
      transform_tolerance: 0.2
      source_timeout: 1.0
      base_shift_correction: true
      stop_pub_timeout: 2.0
      polygons:
      - FootprintApproach
      FootprintApproach:
        type: polygon
        action_type: approach
        footprint_topic: local_costmap/published_footprint
        time_before_collision: 1.2
        simulation_time_step: 0.1
        min_points: 6
        visualize: false
        enabled: true
      observation_sources:
      - scan
      scan:
        type: scan
        topic: /pinky_01/scan
        min_height: 0.15
        max_height: 2.0
        enabled: true
  docking_server:
    ros__parameters:
      controller_frequency: 50.0
      base_frame: pinky_01/base_link
      fixed_frame: pinky_01/odom
      dock_plugins:
      - simple_charging_dock
      simple_charging_dock:
        plugin: opennav_docking::SimpleChargingDock
        docking_threshold: 0.05
        staging_x_offset: -0.7
        use_external_detection_pose: false
        use_battery_status: false
        use_stall_detection: false
