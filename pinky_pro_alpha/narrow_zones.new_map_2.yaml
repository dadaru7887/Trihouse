# new_map_2 전용 저속 협로 표.
#
# 충전 베이는 시작점 바로 앞의 벽 여유가 작다. 따라서 어떤 주문이든 일반 Nav2 를
# 먼저 보내지 않고, 두 출발 waypoint가 공유하는 하나의 narrow_4 탈출 규칙을 실행한
# 다음 Nav2를 시작한다. 규칙 속도는 fleet_node -> cmd_vel_dock -> safety supervisor를
# 거쳐 최종 cmd_vel로 전달된다.
map_name: new_map_2

zones:
  # 창고 entry는 Nav2가 규칙 제어에 넘길 map pose이고, zone은 도킹 뒤 로봇을
  # 포함하는 출발 감지 영역이다. ArUco marker 없이 enter/exit 고정 규칙만 사용한다.
  ambient_storage_loading_dock_01:
    enabled: true
    # 2026-08-23 수동 배치 후 AMCL로 다시 측정한 상온 진입값. ArUco는 사용하지 않는다.
    entry: { x: 0.911748152598201, y: 0.77587646431032, yaw: 0.875201645910827 }
    entry_zone:
      { x: 0.911748152598201, y: 0.77587646431032, yaw: 0.875201645910827, length: 0.05, width: 0.20 }
    # entry에서 입고 시퀀스를 적용해 계산한 후보 도크 pose다. 실물 검증 전에는
    # measured.dock_pose=false로 두어 일반 주문 배정을 닫는다.
    zone: { x: 1.194985191182392, y: 0.874754065282721, yaw: -2.805721254488808, length: 0.20, width: 0.20 }
    dock_target: { x: 1.194985191182392, y: 0.874754065282721, yaw: -2.805721254488808 }
    enter:
      - [rotate, -2.805721254488808]
      - [straight, -0.30]
    exit:
      - [straight, 0.30]
      - [rotate, -3.130293455959265]
      - [exit_zone, null]
    exit_target: { x: 0.911748152598201, y: 0.77587646431032, yaw: -3.130293455959265 }
    measured:
      source: manual_placement_amcl
      entry_pose: true
      dock_pose: false
      enter: true
      exit: true
      entry_pose_date: 2026-08-23
      note: dock_target은 새 실측 entry에서 narrow_1 이동량을 적용한 후보값이므로 calibration 주행이 필요하다.

  chilled_storage_loading_dock_01:
    enabled: true
    # 2026-08-23 수동 배치 후 AMCL로 다시 측정한 냉장 진입값. ArUco는 사용하지 않는다.
    entry: { x: 0.7859059395041531, y: 0.875244991226244, yaw: 0.8744648231294354 }
    entry_zone:
      { x: 0.7859059395041531, y: 0.875244991226244, yaw: 0.8744648231294354, length: 0.05, width: 0.20 }
    zone: { x: 1.3263418779273253, y: -0.2988701614809928, yaw: 2.4189105956431427, length: 0.20, width: 0.20 }
    dock_target: { x: 1.3263418779273253, y: -0.2988701614809928, yaw: 2.4189105956431427 }
    enter:
      - [rotate, 2.4189105956431427]
      - [straight, -0.30]
    exit:
      - [straight, 0.30]
      - [rotate, -3.130293455959265]
      - [exit_zone, null]
    exit_target: { x: 0.7859059395041531, y: 0.875244991226244, yaw: -3.130293455959265 }
    measured:
      source: manual_placement_amcl
      entry_pose: true
      dock_pose: false
      enter: false
      exit: false
      entry_pose_date: 2026-08-23
      note: 새 entry만 실측되었고 narrow_2 시퀀스와 dock_target은 기존 미검증 후보이므로 calibration 주행이 필요하다.

  frozen_storage_loading_dock_01:
    # j_narrow3_rule_based_docking_1.py의 narrow_3 실측값을 그대로 사용한다.
    # Nav2는 이 입구까지만 오고, 아래 고정 규칙이 냉동 도크까지 주차한다.
    entry: { x: 0.9198039894575488, y: -1.1892528962848725, yaw: -0.03242978898931081 }
    # EN: Nav2 yields control anywhere in this oriented box. Rule control then
    # closes the remaining position and yaw error against `entry`.
    # KO: Nav2는 이 회전 직사각형 안에서 제어권을 넘긴다. 남은 위치와 yaw 오차는
    # 규칙 제어가 `entry` 값에 맞춘다.
    entry_zone:
      { x: 0.9198039894575488, y: -1.1892528962848725, yaw: -0.03242978898931081, length: 0.10, width: 0.20 }
    # 도킹 뒤 로봇이 머무르는 직사각형. entry와 분리해야 다음 출발 명령에서
    # 역순 탈출 시퀀스를 선택할 수 있다.
    # 원본에는 별도 dock 좌표가 없으므로 entry에서 원본 sequence를 적분한 예상값이다.
    zone: { x: 1.036067117750, y: -0.933812857015, yaw: -0.9057963267948966, length: 0.20, width: 0.20 }
    dock_target: { x: 1.036067117750, y: -0.933812857015, yaw: -0.9057963267948966 }
    enter:
      - [straight, 0.325]
      - [rotate, -0.9057963267948966]
      - [straight, -0.338]
    # 원본 Python의 sequence_exit를 그대로 옮긴다.
    exit:
      - [straight, 0.315]
      - [rotate, -2.999132807834344]
      - [exit_zone, null]
    # exit_zone의 종료 좌표는 원본에 없으므로 실측 전까지 entry 중심을 검증 후보로 둔다.
    exit_target: { x: 0.9198039894575488, y: -1.1892528962848725, yaw: -2.999132807834344 }
    measured:
      source: /home/newuser/Downloads/j_narrow3_rule_based_docking_1.py
      entry_pose: true
      dock_pose: false
      enter: true
      exit: false
      entry_pose_date: 2026-08-15
      note: >-
        narrow_3 원본값: 0.325 m 직진, yaw -0.9057963267948966 rad로 회전,
        0.338 m 후진. dock_target은 이 시퀀스를 적분한 예상값이므로 이번 실기에서 검증한다.

  charging_narrow_departure:
    # 두 대기/충전 waypoint는 하나의 narrow_4 탈출 상태를 공유한다. 아래 반경은
    # 출발 트리거일 뿐 별개의 물리 협로 zone이 아니다.
    enabled: true
    approach_required: false
    departure_triggers:
      - { name: start_zone_1, x: 0.171, y: 0.202, radius: 0.30 }
      - { name: start_zone_2, x: 0.076, y: -0.013, radius: 0.30 }
    entry: null
    zone: null
    enter: []
    exit:
      - [straight, 0.70]
    dock_target: null
    exit_target: { x: 0.7992961442, y: 0.0854053105, yaw: 0.0923642279 }
    # 실측점 반경에 먼저 들어오면 0.70 m를 모두 채우기 전이라도 즉시 정지한다.
    exit_completion_radius: 0.15
    measured:
      exit: true
      date: 2026-08-22
      source: j_narrow3_rule_based_docking_1.py_and_waypoint.md_pk02_amcl
      note: >-
        start_zone_1/2 반경 0.30 m 안에서 다음 주문을 받으면 0.70 m 저속 직진한 뒤,
        실측 exit_target 허용 반경을 확인하고 원래 주문 목적지의 Nav2를 시작한다.
